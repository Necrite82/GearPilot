name: Map pieces (client tables)

# Builds GearPilotPro/Data/MapOverlays.lua (the detail pieces of every zone map) from the WoW Forever client tables
# on wago.tools, rebuilds the install archive and proposes changes as one pull request into main (branch
# data/maps). Nothing is merged automatically.
on:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]
    paths:
      - tools/maps/**
      - .github/workflows/maps.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Build and check
        run: |
          set -e
          python3 tools/maps/build_overlays.py | tee "$RUNNER_TEMP/summary.txt"
          luac5.1 -p GearPilotPro/Data/MapOverlays.lua
          lua5.1 tests/run.lua

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          file=GearPilotPro/Data/MapOverlays.lua
          # Only the build line changed: same pieces, nothing to propose.
          if [ -z "$(git diff -U0 -- "$file" | grep '^[-+] ' | grep -v 'source = ')" ]; then
            echo "Map pieces unchanged"; git checkout -- "$file"; exit 0
          fi
          python3 tools/build_release.py
          build=$(grep -o 'source = "[^"]*"' "$file" | head -1 | cut -d'"' -f2)
          branch="data/maps"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A "$file" dist
          git commit -qm "Kartenteile: Client-Build $build"
          git push -q --force -u origin "$branch"
          {
            echo "Kartenteile aller Zonenkarten aus den Tabellen des WoW-Forever-Clients (wago.tools, Build \`$build\`)."
            echo
            echo "- $(tail -1 "$RUNNER_TEMP/summary.txt")"
            echo
            echo "Automatisch erzeugt von \`.github/workflows/maps.yml\`. Vor dem Mergen im Spiel eine Karte im Kartenfenster ansehen."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$branch" --base main --title "Kartenteile: Client-Build $build" --body-file "$RUNNER_TEMP/body.md"
          fi
