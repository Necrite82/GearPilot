name: Release
# Start it by hand (Actions > Release > Run workflow on main) or push a tag such as v1.0.0: tests, archive check,
# GitHub release (the manual start creates the tag v<version from the TOC> itself) and CurseForge upload.
# "Publish to" picks both, only GitHub (e.g. while CurseForge still moderates the project) or only CurseForge
# (a later upload, or a retry after a failed upload). An existing GitHub release is kept, not an error.
# Needs: "## Version: x.y.z" and "## X-Curse-Project-ID: <id>" in the TOC, dist/GearPilot-x.y.z.zip,
# docs/RELEASE_x.y.z.md and the repository secret CF_API_TOKEN.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Publish to
        type: choice
        options: [GitHub and CurseForge, only GitHub, only CurseForge]
        default: GitHub and CurseForge
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # a manual start only releases main
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate runtime
        run: |
          find GearPilotPro tests -name '*.lua' -exec luac5.1 -p {} +
          lua5.1 tests/run.lua
      - name: Verify install archive
        run: python3 tools/build_release.py --check
      - name: Release tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION=$(sed -n 's/^## Version: *//p' GearPilotPro/GearPilotPro.toc | tr -d '\r')
            echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - name: Check version and CurseForge settings
        run: |
          VERSION="${TAG#v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Only x.y.z versions are released, not $VERSION"; exit 1; }
          grep -q "^## Version: $VERSION" GearPilotPro/GearPilotPro.toc
          test -f "dist/GearPilot-$VERSION.zip" && test -f "docs/RELEASE_$VERSION.md"
          python3 tools/upload_curseforge.py "$TAG" --dry-run
      - name: Publish GitHub release
        if: inputs.target != 'only CurseForge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG exists already, kept"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" "dist/GearPilot-$VERSION.zip" --target "$GITHUB_SHA" --title "GearPilot $VERSION" --notes-file "docs/RELEASE_$VERSION.md"
          else
            gh release create "$TAG" "dist/GearPilot-$VERSION.zip" --verify-tag --title "GearPilot $VERSION" --notes-file "docs/RELEASE_$VERSION.md"
          fi
      - name: Upload to CurseForge
        if: inputs.target != 'only GitHub'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 tools/upload_curseforge.py "$TAG"
